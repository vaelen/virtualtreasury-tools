# vtnamebench config — compare models on the `vtextract names` person-NER task.
#
# Run:  uv run vtnamebench bench.toml
#       (add --force to re-run models that already have sidecars)
#
# `input` must be a folder containing flat *.txt transcription files (one per
# document). The tool writes per-model output under <input>/models/<model>/.
# EDIT THIS to point at your test folder:
input = "benchmark"

# Each provider/model uses LiteLLM's `provider/model` naming. Remote models need
# the matching API key in your environment:
#   OPENAI_API_KEY, ANTHROPIC_API_KEY, MISTRAL_API_KEY, GEMINI_API_KEY,
#   DEEPSEEK_API_KEY. Local (ollama/*) models need `ollama serve` running and
#   the model pulled (`ollama pull <name>`).
#
# Trim this list to control cost/time — every listed model runs over every file.
models = [
  # --- Local via Ollama: small models (1-3B; fast, low recall floor) --------
  "ollama/llama3.2:1b",   # smallest; speed/quality floor reference
  "ollama/llama3.2:3b",   # tiny but coherent; cheap recall baseline
  "ollama/qwen2.5:3b",    # 3B qwen; size control vs the 7B/14B

  # --- Local via Ollama: 7-9B baselines (no API cost; watch JSON validity) --
  "ollama/llama3.1:8b",   # reliable general 8B (hallucinated in the last run)
  "ollama/qwen2.5:7b",    # under-extracted badly last run — see qwen3 below
  "ollama/gemma2:9b",     # safest local last run, but mediocre recall
  "ollama/mistral:7b",    # local counterpart to the Mistral API models
  "ollama/granite3.3:8b", # IBM Granite: tuned for extraction/RAG, strong JSON
  "ollama/qwen3:8b",      # dense 8B; direct successor to the qwen2.5 that bailed

  # --- Local via Ollama: 12-14B (fits the 3060's 12GB at Q4; long cold-start)
  "ollama/phi4",            # 14B, punches above its size on reasoning
  "ollama/gemma3:12b",      # successor to gemma2; keep the discipline, more recall?
  "ollama/mistral-nemo:12b",# real upgrade over the weak mistral:7b
  "ollama/qwen2.5:14b",     # 14B size control vs the 7B; on-prem viability test
  "ollama/qwen3:14b",       # dense 14B; strongest qwen3 that fits the 3060

  # --- Too big for the RTX 3060 (12GB VRAM): not pulled locally. On this box
  # --- they spill to CPU and crawl — uncomment only on a larger GPU. ---------
  # "ollama/gpt-oss:20b",     # open-weights GPT; how does it stack up locally?
  # "ollama/qwen3:30b-a3b",   # 30B MoE (3B active) — quality at lower compute
  # "ollama/qwen3.6:35b-a3b", # newer 35B MoE; the strongest qwen variant on hand
  # "ollama/qwen2.5:32b",     # 32B size control vs the 7B; on-prem viability test
  # "ollama/llama3.3:70b",    # 70B; needs far more than 12GB

  # --- Anthropic ------------------------------------------------------------
  "anthropic/claude-haiku-4-5",   # fast/cheap; the names-default tier
  "anthropic/claude-sonnet-4-6",  # mid-tier, very good at coreference
  "anthropic/claude-opus-4-8",    # top-tier quality ceiling (slow/pricey)

  # --- Mistral --------------------------------------------------------------
  "mistral/mistral-small-latest",  # cheap, solid JSON adherence
  "mistral/mistral-large-latest",  # Mistral flagship
  "mistral/ministral-8b-latest",   # small edge model; good cost baseline

  # --- OpenAI ---------------------------------------------------------------
  "openai/gpt-4.1-mini",        # cheap workhorse; strong instruction-following
  "openai/gpt-4.1",             # flagship-tier quality ceiling
  "openai/gpt-4.1-nano",        # cheapest 4.1 tier — how low can cost go?
  "openai/gpt-4o-mini",         # older mini, useful baseline
  "openai/o4-mini",             # reasoning: does it fix garbled-OCR coreference?

  # --- Google Gemini (strong + cheap; good at structured extraction) --------
  "gemini/gemini-2.5-flash",       # fast, high quality for the price
  "gemini/gemini-2.5-pro",         # flagship quality ceiling
  "gemini/gemini-2.5-flash-lite",  # cheapest tier — where does recall collapse?

  # --- DeepSeek (very cheap; competitive on extraction) ---------------------
  "deepseek/deepseek-chat",        # V3: cheap cloud baseline
  "deepseek/deepseek-reasoner",    # R1: reasoning on the hard coreference cases
]
