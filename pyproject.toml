[project]
name = "vtextract"
version = "0.1.0"
description = "Download resources from virtualtreasury.ie"
authors = [{ name = "Andrew C. Young", email = "andrew@vaelen.org" }]
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "rich>=13", "textual>=0.50", "textual-image[textual]>=0.11,<0.13", "litellm>=1.40", "pydantic>=2"]

[project.scripts]
vtextract = "vtextract.cli:main"
vtindex = "vtextract.index.cli:main"
vtbrowse = "vtextract.tui.cli:main"
vtnamebench = "vtextract.namebench:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-textual-snapshot>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "strict"
